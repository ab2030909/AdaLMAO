name: release
on:
  push:
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "stable" }
      - run: go vet ./...
      - run: go test ./...

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: write }
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      # If a maintainer already published this release by hand (with locally verified binaries),
      # do nothing so CI never overwrites those assets or their checksums.
      - id: chk
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.chk.outputs.exists == 'false'
        uses: actions/setup-go@v5
        with: { go-version: "stable" }
      - if: steps.chk.outputs.exists == 'false'
        run: make cross VERSION=${GITHUB_REF_NAME#v}
      - if: steps.chk.outputs.exists == 'false'
        run: cd dist && sha256sum adalmao-* > checksums.txt && cat checksums.txt
      - if: steps.chk.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: true
          name: AdaLmao ${{ github.ref_name }} — Early Access
          body_path: RELEASE_NOTES.md
